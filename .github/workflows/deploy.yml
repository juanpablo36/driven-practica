name: Deploy to GitHub Pages

on:
  push:
    branches:
      - branches
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: proyecto_final/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: proyecto_final

      - name: Compilar frontend
        run: npm run build
        working-directory: proyecto_final
        env:
          VITE_BASE_URL: /driven-practica/

      - name: Generar 404.html para soporte de SPA
        run: cp proyecto_final/dist/index.html proyecto_final/dist/404.html

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: proyecto_final/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
